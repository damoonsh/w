<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>thumb</title>
  <style>
    html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; background: #2b2d35; }
    canvas { display: block; }
  </style>
</head>
<body>
<canvas id="c" width="1280" height="640"></canvas>
<script>
(function () {
  var ctx = document.getElementById('c').getContext('2d');
  var W = 1280, H = 640, cx = 640, cy = 320, R = 205;

  var img = ctx.createImageData(W, H), d = img.data;
  for (var i = 0; i < d.length; i += 4) {
    var n = 12 + Math.random() * 12;
    d[i] = 41 + n; d[i + 1] = 44 + n; d[i + 2] = 52 + n; d[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);

  function hex(r) {
    ctx.beginPath();
    for (var k = 0; k < 6; k++) {
      var a = -Math.PI / 2 + k * Math.PI / 3;
      var x = cx + r * Math.cos(a);
      var y = cy + r * Math.sin(a);
      if (k === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
  }

  // Kaggle hex, not Kaggle cyan (#20BEFF) — dusk cornflower
  hex(R);
  ctx.fillStyle = '#4d7eb8';
  ctx.fill();

  ctx.fillStyle = '#f4f8fb';
  function poly(pts) {
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var j = 1; j < pts.length; j++) ctx.lineTo(pts[j][0], pts[j][1]);
    ctx.closePath();
    ctx.fill();
  }

  // Kaggle K geometry (tighter, official-ish)
  poly([
    [cx - 70, cy],
    [cx - 10, cy - 82],
    [cx + 18, cy - 58],
    [cx - 22, cy],
    [cx + 18, cy + 58],
    [cx - 10, cy + 82]
  ]);
  poly([
    [cx + 2, cy - 16],
    [cx + 34, cy - 70],
    [cx + 76, cy - 70],
    [cx + 28, cy - 6]
  ]);
  poly([
    [cx + 2, cy + 16],
    [cx + 28, cy + 6],
    [cx + 76, cy + 70],
    [cx + 34, cy + 70]
  ]);
})();
</script>
</body>
</html>
