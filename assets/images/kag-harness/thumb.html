<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>thumb</title>
  <style>
    html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; background: #2b2d35; }
    canvas { display: block; }
  </style>
</head>
<body>
<canvas id="c" width="1280" height="640"></canvas>
<script>
(function () {
  var c = document.getElementById('c');
  var ctx = c.getContext('2d');
  var W = 1280, H = 640;

  function noise() {
    var img = ctx.createImageData(W, H);
    var d = img.data;
    for (var i = 0; i < d.length; i += 4) {
      var n = 18 + Math.random() * 14;
      d[i] = 43 + n; d[i + 1] = 45 + n; d[i + 2] = 53 + n; d[i + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
  }

  function stroke(color, width, points, wobble) {
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    for (var i = 0; i < points.length; i++) {
      var x = points[i][0] + (Math.random() - 0.5) * wobble;
      var y = points[i][1] + (Math.random() - 0.5) * wobble;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  noise();

  ctx.strokeStyle = 'rgba(168,198,232,0.06)';
  ctx.lineWidth = 1;
  for (var y = 80; y < H; y += 36) {
    ctx.beginPath();
    ctx.moveTo(40, y);
    ctx.lineTo(W - 40, y);
    ctx.stroke();
  }

  // conservative path — keeps going, shallow
  stroke('rgba(122,175,212,0.88)', 2.6, [
    [160, 430], [280, 400], [400, 390], [520, 370], [680, 355], [840, 340], [1040, 328]
  ], 5);

  // ambitious path — dives, then abandoned (stops mid-canvas)
  stroke('rgba(212,138,138,0.78)', 2.3, [
    [160, 430], [260, 360], [340, 250], [420, 180], [500, 220], [560, 410]
  ], 6);

  // early-exit tick marks — sessions that HANDOFF
  ctx.fillStyle = 'rgba(232,184,109,0.55)';
  var xs = [360, 480, 560, 620];
  for (var i = 0; i < xs.length; i++) {
    ctx.fillRect(xs[i] + Math.random() * 4, 300 + Math.random() * 18, 8, 26);
  }

  function box(x, y, w, h, color) {
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(x + 4, y);
    ctx.lineTo(x + w, y + 2);
    ctx.lineTo(x + w - 3, y + h);
    ctx.lineTo(x, y + h - 3);
    ctx.closePath();
    ctx.stroke();
  }
  // slot boxes
  box(190, 165, 150, 78, 'rgba(216,220,232,0.32)');
  box(370, 150, 150, 78, 'rgba(122,175,212,0.42)');
  box(550, 168, 150, 78, 'rgba(232,184,109,0.38)');
  box(730, 155, 150, 78, 'rgba(212,138,138,0.35)');

  ctx.fillStyle = 'rgba(143,150,170,0.55)';
  ctx.font = '18px ui-serif, Georgia, serif';
  ctx.fillText('stop short', 200, 560);
})();
</script>
</body>
</html>
