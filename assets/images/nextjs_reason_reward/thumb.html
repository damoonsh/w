<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>thumb</title>
  <style>
    html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; background: #2b2d35; }
    canvas { display: block; }
  </style>
</head>
<body>
<canvas id="c" width="1280" height="640"></canvas>
<script>
(function () {
  var ctx = document.getElementById('c').getContext('2d');
  var W = 1280, H = 640;
  ctx.fillStyle = '#2b2d35';
  ctx.fillRect(0, 0, W, H);

  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  var base = 470;

  // Long traces, low: five thin bars, tallest on the left
  var bars = [280, 240, 200, 168, 140];
  bars.forEach(function (h, i) {
    ctx.globalAlpha = 0.88 - i * 0.1;
    ctx.fillStyle = '#D93A3A';
    roundRect(168 + i * 52, base - h, 34, h, 8);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  // Brief mid: two short blocks
  ctx.fillStyle = '#F5E6A6';
  roundRect(520, base - 92, 88, 92, 14);
  ctx.fill();
  ctx.fillStyle = '#EDB27A';
  roundRect(628, base - 118, 88, 118, 14);
  ctx.fill();

  // Hint lift: gold disc above the brief blocks
  ctx.fillStyle = '#e8b86d';
  ctx.beginPath();
  ctx.arc(618, 188, 46, 0, Math.PI * 2);
  ctx.fill();

  // High reward: rust circle
  ctx.fillStyle = '#c45c26';
  ctx.beginPath();
  ctx.arc(980, 300, 132, 0, Math.PI * 2);
  ctx.fill();

  // AGENTS.md as a slim page
  ctx.fillStyle = '#7aafd4';
  roundRect(790, 210, 28, 170, 6);
  ctx.fill();
})();
</script>
</body>
</html>
