<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>thumb</title>
  <style>
    html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; background: #2b2d35; }
    canvas { display: block; }
  </style>
</head>
<body>
<canvas id="c" width="1280" height="640"></canvas>
<script>
(function () {
  var c = document.getElementById('c');
  var ctx = c.getContext('2d');
  var W = 1280, H = 640;

  function noise() {
    var img = ctx.createImageData(W, H);
    var d = img.data;
    for (var i = 0; i < d.length; i += 4) {
      var n = 18 + Math.random() * 14;
      d[i] = 43 + n; d[i + 1] = 45 + n; d[i + 2] = 53 + n; d[i + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
  }

  function stroke(color, width, points, wobble) {
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    for (var i = 0; i < points.length; i++) {
      var x = points[i][0] + (Math.random() - 0.5) * wobble;
      var y = points[i][1] + (Math.random() - 0.5) * wobble;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  noise();
  ctx.strokeStyle = 'rgba(168,198,232,0.06)';
  ctx.lineWidth = 1;
  for (var y = 80; y < H; y += 36) {
    ctx.beginPath();
    ctx.moveTo(40, y);
    ctx.lineTo(W - 40, y);
    ctx.stroke();
  }

  // left: mute frame (eye, no rings)
  stroke('rgba(122,175,212,0.9)', 2.6, [
    [220, 250], [280, 210], [360, 200], [430, 230], [450, 290], [410, 350], [330, 380], [250, 350], [210, 290], [220, 250]
  ], 4);
  ctx.beginPath();
  ctx.arc(330, 285, 28, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(216,220,232,0.55)';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(330, 285, 10, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(122,175,212,0.55)';
  ctx.fill();

  // dashed silence
  ctx.setLineDash([8, 10]);
  stroke('rgba(143,150,170,0.45)', 1.6, [[200, 430], [480, 430]], 2);
  ctx.setLineDash([]);

  // center knot: shared latent
  var cx = 640, cy = 300;
  stroke('rgba(232,184,109,0.85)', 2.8, [
    [cx - 70, cy], [cx - 20, cy - 50], [cx + 40, cy - 20], [cx + 10, cy + 40], [cx - 50, cy + 30], [cx - 70, cy]
  ], 5);
  stroke('rgba(232,184,109,0.5)', 1.8, [
    [cx - 40, cy - 10], [cx + 30, cy + 15], [cx - 10, cy + 45]
  ], 4);

  // right: invented sound rings from the same crash
  for (var r = 48; r <= 168; r += 40) {
    ctx.beginPath();
    ctx.ellipse(960, 285, r * 1.15, r * 0.72, -0.12, 0.15, Math.PI * 1.7);
    ctx.strokeStyle = 'rgba(212,138,138,' + (0.72 - r / 420) + ')';
    ctx.lineWidth = 2.1;
    ctx.stroke();
  }
  stroke('rgba(212,138,138,0.75)', 2.2, [
    [820, 470], [880, 430], [940, 455], [1000, 400], [1080, 430], [1140, 390]
  ], 6);

  ctx.fillStyle = 'rgba(143,150,170,0.55)';
  ctx.font = '18px ui-serif, Georgia, serif';
  ctx.fillText('mute  →  prior', 200, 560);
})();
</script>
</body>
</html>
